[package]
name = "scip-php"
version = "0.2.1"
edition = "2024"
description = "SCIP indexer for PHP"
license = "MIT"
rust-version = "1.93"

[dependencies]
scip = "0.6.1"
mago-syntax = "1.13"
mago-names = "1.13"
mago-codex = "1.13"
mago-composer = "1.13"
mago-docblock = "1.13"
mago-span = "1.13"
mago-database = "1.13"
mago-php-version = "1.13"
bumpalo = "3"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
protobuf = "3.7"

[profile.release]
opt-level = 3
lto = true
